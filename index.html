<style>
/* Layout: one-screen yard. Stencil title over a fenced lot; crates are the only saturated thing on screen. */
:root{
  --ground:#d9dde0; --ground-2:#cdd2d6; --ink:#20262b; --muted:#5d6870;
  --steel:#8f9aa3; --steel-2:#6f7a83; --panel:#eef0f2; --line:#bcc3c9;
  --hazard:#f2b632; --hazard-ink:#20262b;
  --c-r:#df4f39; --c-b:#2c7bd0; --c-y:#f0b42c; --c-g:#3a9f66; --c-p:#8757d3;
  --display:"Saira Stencil One", "Impact", "Arial Narrow", sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#1c2126; --ground-2:#232a30; --ink:#e7ebee; --muted:#93a0aa;
  --steel:#5d6973; --steel-2:#47515a; --panel:#262d34; --line:#36404a;
  --hazard:#e9ab24; --hazard-ink:#14181c; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#1c2126; --ground-2:#232a30; --ink:#e7ebee; --muted:#93a0aa;
  --steel:#5d6973; --steel-2:#47515a; --panel:#262d34; --line:#36404a;
  --hazard:#e9ab24; --hazard-ink:#14181c; color-scheme:dark}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:18px 24px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:.9;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--hazard)}
.meta{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-size:22px;font-weight:700;line-height:1}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.levelbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvname{font-weight:700;font-size:17px}
.lvname small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px}
button{font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;min-width:42px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--steel)}
button:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--hazard);color:var(--hazard-ink);border-color:transparent}
.stage{display:flex;justify-content:center}
.yard{position:relative;border-radius:6px;
  background:
   repeating-linear-gradient(45deg,transparent 0 5px,var(--steel) 5px 6.5px),
   repeating-linear-gradient(-45deg,transparent 0 5px,var(--steel) 5px 6.5px),
   var(--steel-2);
  box-shadow:inset 0 0 0 2px var(--steel-2)}
.board{position:absolute;background:var(--ground-2);touch-action:none;overflow:visible;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);background-position:-1px -1px}
.post{position:absolute;width:calc(var(--f) * .9);height:calc(var(--f) * .9);border-radius:50%;
  background:var(--steel-2);box-shadow:inset 0 0 0 2px var(--steel)}
.gate{position:absolute;display:flex;align-items:center;justify-content:center;background:var(--gc);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.gate::before{content:"";position:absolute;inset:0;opacity:.35;
  background:repeating-linear-gradient(var(--chev),transparent 0 6px,rgba(255,255,255,.9) 6px 9px)}
.gate svg{position:relative;width:calc(var(--f) * .6);height:calc(var(--f) * .6);fill:#fff}
.wall{position:absolute;border-radius:4px;
  background:repeating-linear-gradient(45deg,var(--hazard) 0 8px,var(--hazard-ink) 8px 16px);
  box-shadow:inset 0 0 0 3px var(--ground-2),inset 0 0 0 5px var(--hazard-ink)}
.crate{position:absolute;left:0;top:0;box-sizing:border-box;border-radius:6px;cursor:grab;touch-action:none;
  background:
   repeating-linear-gradient(0deg,transparent 0 calc(var(--cell)/3 - 2px),rgba(0,0,0,.13) calc(var(--cell)/3 - 2px) calc(var(--cell)/3)),
   var(--cc);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.22),inset 0 0 0 5px rgba(255,255,255,.18),0 3px 0 rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  transition:transform 90ms ease-out,opacity 260ms ease-in}
.crate svg{width:min(34%,calc(var(--cell) * .38));height:auto;fill:rgba(255,255,255,.92);filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));pointer-events:none}
.crate.held{cursor:grabbing;z-index:5;box-shadow:inset 0 0 0 3px rgba(0,0,0,.22),inset 0 0 0 5px rgba(255,255,255,.3),0 6px 10px rgba(0,0,0,.3)}
.crate.bump{animation:bump 160ms}
@keyframes bump{50%{filter:brightness(1.25)}}
.crate.leaving{transition:transform 280ms ease-in,opacity 280ms ease-in;opacity:0}
.win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:color-mix(in srgb,var(--ground-2) 88%,transparent);border-radius:4px;text-align:center;padding:16px}
.win h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,36px);margin:0}
.win p{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;line-height:1.45;max-width:60ch;margin:0}
@media (prefers-reduced-motion: reduce){.crate,.crate.leaving{transition:none}.crate.bump{animation:none}}

:root{--c-t:#1b9e9a}
.crate .ar{position:absolute;width:calc(var(--cell)*.2);height:calc(var(--cell)*.2);fill:rgba(255,255,255,.8);pointer-events:none}
.crate.lock-h .ar{top:50%;margin-top:calc(var(--cell)*-.1)}.crate.lock-h .a1{left:7%}.crate.lock-h .a2{right:7%}
.crate.lock-v .ar{left:50%;margin-left:calc(var(--cell)*-.1)}.crate.lock-v .a1{top:7%}.crate.lock-v .a2{bottom:7%}
.crate.lock-h{background:repeating-linear-gradient(90deg,transparent 0 calc(var(--cell)/3 - 2px),rgba(0,0,0,.13) calc(var(--cell)/3 - 2px) calc(var(--cell)/3)),var(--cc)}
.stat b.star{color:var(--hazard)}
.win .btns{display:flex;gap:8px}
</style>

</head><body>
<div class="app">

      <button id="next" aria-label="Next yard">▶</button>

  </div>
  <div class="stage" id="stage"><div class="yard" id="yard"><div class="board" id="board"></div></div></div>

</div>

function allowed(b){return b.lock==='h'?['left','right']:b.lock==='v'?['up','down']:['up','down','left','right'];}
function exitFits(L,b,x,y,dir){if(!allowed(b).includes(dir))return false;return L.exits.some(e=>{if(e.color!==b.c||SIDE_DIR[e.side]!==dir)return false;
 if(dir==='up')return y===0&&x>=e.s&&x+b.w<=e.s+e.len;
 if(dir==='down')return y+b.h===L.h&&x>=e.s&&x+b.w<=e.s+e.len;
 if(dir==='left')return x===0&&y>=e.s&&y+b.h<=e.s+e.len;

function fits(L,g,b,x,y){if(x<0||y<0||x+b.w>L.w||y+b.h>L.h)return false;for(let dx=0;dx<b.w;dx++)for(let dy=0;dy<b.h;dy++)if(g.has((x+dx)+','+(y+dy)))return false;return true;}

  d.style.width=b.w*cell-4+'px';d.style.height=b.h*cell-4+'px';d.innerHTML=GLYPH[b.c]+(b.lock?RAIL[b.lock]:'');
  d.addEventListener('pointerdown',ev=>startDrag(ev,b));board.appendChild(d);return d;});
 blocks.forEach(place);
 if(won)showWin();
}
function place(b){const d=els[b.id];d.hidden=b.gone;if(!b.gone)d.style.transform=`translate(${b.x*cell+2}px,${b.y*cell+2}px)`;}
function snapshot(){return blocks.map(b=>[b.x,b.y,b.gone]);}

function startDrag(ev,b){if(won||b.gone)return;ev.preventDefault();els[b.id].setPointerCapture(ev.pointerId);
 drag={b,sx:ev.clientX,sy:ev.clientY,ox:b.x,oy:b.y,snap:snapshot(),moved:false};els[b.id].classList.add('held');}
function tryStep(b,dir){if(!allowed(b).includes(dir))return null;const g=occSet(L,blocks,b);const [dx,dy]=DV[dir];
 if(fits(L,g,b,b.x+dx,b.y+dy)){b.x+=dx;b.y+=dy;place(b);
  // a crate fully inside its gate's opening and touching that edge is pulled out
  for(const d of allowed(b))if(exitFits(L,b,b.x,b.y,d)){setTimeout(()=>leave(b,d),90);if(drag)drag.moved=true;endDrag();return 'exit';}
  return 'move';}
 if(exitFits(L,b,b.x,b.y,dir)){leave(b,dir);return 'exit';}
 return null;}
function onMove(ev){if(!drag)return;const b=drag.b;
 for(let guard=0;guard<30&&drag;guard++){
  let fx=(ev.clientX-drag.sx)/cell-(b.x-drag.ox), fy=(ev.clientY-drag.sy)/cell-(b.y-drag.oy);
  if(b.lock==='h')fy=0;if(b.lock==='v')fx=0;
  const axes=Math.abs(fx)>=Math.abs(fy)?[['x',fx],['y',fy]]:[['y',fy],['x',fx]];
  let did=null;
  for(const [ax,v] of axes){if(Math.abs(v)<0.55)continue;const dir=ax==='x'?(v>0?'right':'left'):(v>0?'down':'up');
   did=tryStep(b,dir);if(did)break;}
  if(!did||did==='exit')break;drag.moved=true;}
}
function endDrag(){if(!drag)return;const {b,snap,moved}=drag;els[b.id].classList.remove('held');drag=null;
 if(moved){moves++;history.push(snap);updateHud();}}
document.addEventListener('pointermove',onMove);
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

function leave(b,dir){if(b.gone)return;b.gone=true;const d=els[b.id];const [dx,dy]=DV[dir];
 const dist=(dir==='up'||dir==='down'?b.h:b.w)+1;
 d.classList.remove('held');d.classList.add('leaving');
 d.style.transform=`translate(${(b.x+dx*dist)*cell+2}px,${(b.y+dy*dist)*cell+2}px)`;
 if(drag){drag.moved=true;endDrag();}
 setTimeout(()=>{d.classList.remove('leaving');place(b);updateHud();
  if(blocks.every(x=>x.gone)&&!won){won=true;
   const bests=store.get('best',{});if(!bests[level]||moves<bests[level]){bests[level]=moves;store.set('best',bests);}
   if(level+1>unlocked&&level<LEVELS.length){unlocked=level+1;store.set('unlocked',unlocked);}
   updateHud();showWin();}},290);
}
function showWin(){board.querySelector('.win')?.remove();const w=document.createElement('div');w.className='win';const par=L.par;
 const verdict=moves<=par?'On par. Perfect clear.':`Par is ${par}. Try it in fewer moves.`;
 const last=level>=LEVELS.length;
 w.innerHTML=`<h2>${last?'All yards cleared':'Yard cleared'}</h2><p>${moves} moves · ${verdict}</p>`+
  `<div class="btns"><button id="again">Replay</button>${last?'':'<button class="primary" id="go">Next yard ▶</button>'}</div>`;
 board.appendChild(w);w.querySelector('#again').onclick=()=>load(level);if(!last)w.querySelector('#go').onclick=()=>load(level+1);}
function updateHud(){
 $('moves').textContent=moves;$('par').textContent=L.par;
 const best=store.get('best',{})[level];$('best').textContent=best??'–';$('best').classList.toggle('star',best!=null&&best<=L.par);
 const locks=blocks.filter(b=>b.lock).length;
 $('lvname').innerHTML=`Yard ${level}${L.name?': '+L.name:''}<small>${L.w}×${L.h} lot · ${blocks.length} crates${locks?' · '+locks+' on rails':''}</small>`;
 $('prev').disabled=level<=1;$('next').disabled=level>=unlocked;$('undo').disabled=!history.length||won;}
$('undo').onclick=()=>{if(!history.length||won)return;const s=history.pop();
 blocks.forEach((b,i)=>{[b.x,b.y,b.gone]=s[i];place(b);});moves=Math.max(0,moves-1);updateHud();};
$('reset').onclick=()=>load(level);
$('prev').onclick=()=>level>1&&load(level-1);
$('next').onclick=()=>level<unlocked&&load(level+1);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>L&&layout(),120);});
load(Math.min(level,unlocked));

</script>
